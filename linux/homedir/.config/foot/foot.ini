[main]
font=monospace:size=11
pad=4x4
# Foot defaults to initial-window-size-pixels=700x500, which is a tiny window on
# a 4K output. Size in cells instead so it's independent of font size.
# (Safe here: the output runs at scale 1.0 -- see the fractional-scaling caveat
# in foot.ini(5) if a differently-scaled monitor is ever added.)
initial-window-size-chars=110x41
# Foot's own selections (Shift+drag while tmux has the mouse) land in both the
# PRIMARY and CLIPBOARD selections instead of PRIMARY only.
selection-target=both

[scrollback]
# Foot has no true "infinite" setting, but a very large number
# is effectively unlimited for normal use (uses more RAM as it fills).
lines=100000

[csd]
# Border only shows if the compositor is actually using CSD.
# Set to "client" to force it if your WM/compositor defaults to
# server-side decorations (e.g. Sway) and you still want the border.
preferred=client
border-width=2
border-color=ff404040
