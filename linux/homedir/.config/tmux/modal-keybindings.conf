# tmux-modal keybindings — customized to match the nvim jkl; motion scheme.
# (h/j/k/l → j/l/k/;  and  H/J/K/L → J/L/K/:)
# Loaded via `set -g @modal-keybindings-conf '~/.config/tmux/modal-keybindings.conf'`.

# Enter modal command mode.
KBD_CMD=M-m

# Exit modal command mode.
KBD_CMD_EXIT=M-m

# Quit command. Used to exit sticky modes (e.g. w r).
KBD_QUIT=q

# Enter copy mode.
KBD_COPY_MODE=c

# Paste buffer.
KBD_PASTE=y

# Open the tmux command prompt.
KBD_CMD_PROMPT=:

# Window command prefix.
KBD_WIN=w

## Select window 0-9.
KBD_WIN_GOTO_0=0
KBD_WIN_GOTO_1=1
KBD_WIN_GOTO_2=2
KBD_WIN_GOTO_3=3
KBD_WIN_GOTO_4=4
KBD_WIN_GOTO_5=5
KBD_WIN_GOTO_6=6
KBD_WIN_GOTO_7=7
KBD_WIN_GOTO_8=8
KBD_WIN_GOTO_9=9

## Select window with tree view / by index.
KBD_WIN_GOTO_TREE=t
KBD_WIN_GOTO_INDEX=i

## Pane selection (jkl; instead of hjkl).
KBD_WIN_PANE_LEFT=j
KBD_WIN_PANE_RIGHT=;
KBD_WIN_PANE_UP=k
KBD_WIN_PANE_DOWN=l

## Delete window pane.
KBD_WIN_PANE_DEL=d

## Previous / next window (J/: instead of H/L).
KBD_WIN_PREV=J
KBD_WIN_NEXT=:

## Delete / create / last window.
KBD_WIN_DEL=D
KBD_WIN_CREATE=c
KBD_WIN_LAST=o

## Zoom / break / number / rename.
KBD_WIN_ZOOM=z
KBD_WIN_BREAK=b
KBD_WIN_NR=n
KBD_WIN_RENAME=,

##q Pane command prefix (same bindings as KBD_WIN but without the prefix).
KBD_WIN_PANE=w

## Split command prefix.
KBD_WIN_SPLIT=s

### Split right / down.
KBD_WIN_SPLIT_RIGHT=;
KBD_WIN_SPLIT_DOWN=l

## Move command prefix.
KBD_WIN_MOVE=m

### Move pane up / down.
KBD_WIN_MOVE_UP=k
KBD_WIN_MOVE_DOWN=l

## Arrange command prefix.
KBD_WIN_ARRANGE=a

### Layouts 1-4.
KBD_WIN_ARRANGE_1=1
KBD_WIN_ARRANGE_2=2
KBD_WIN_ARRANGE_3=3
KBD_WIN_ARRANGE_4=4

##q Resize command prefix.
KBD_WIN_RESIZE=r

### Resize pane one step (jkl; instead of hjkl).
KBD_WIN_RESIZE_LEFT=j
KBD_WIN_RESIZE_RIGHT=;
KBD_WIN_RESIZE_DOWN=l
KBD_WIN_RESIZE_UP=k

### Resize pane multiple steps (J/L/K/: instead of H/J/K/L).
KBD_WIN_RESIZE_MULTI_LEFT=J
KBD_WIN_RESIZE_MULTI_RIGHT=:
KBD_WIN_RESIZE_MULTI_DOWN=L
KBD_WIN_RESIZE_MULTI_UP=K

# Session command prefix.
KBD_SESS=s

## Detach session.
KBD_SESS_DETACH=d

## Previous / next session (j/; instead of h/l).
KBD_SESS_PREV=j
KBD_SESS_NEXT=;

## Session tree view / delete / rename.
KBD_SESS_TREE=t
KBD_SESS_DEL=D
KBD_SESS_RENAME=,

# "Go to" command prefix.
KBD_GOTO=g

## Go to window command prefix.
KBD_GOTO_WIN=w

### Go to window 0-9.
KBD_GOTO_WIN_0=0
KBD_GOTO_WIN_1=1
KBD_GOTO_WIN_2=2
KBD_GOTO_WIN_3=3
KBD_GOTO_WIN_4=4
KBD_GOTO_WIN_5=5
KBD_GOTO_WIN_6=6
KBD_GOTO_WIN_7=7
KBD_GOTO_WIN_8=8
KBD_GOTO_WIN_9=9

### Go to window with tree view / by index.
KBD_GOTO_WIN_TREE=t
KBD_GOTO_WIN_INDEX=i

### Go to previous / next / last window.
KBD_GOTO_WIN_PREV=j
KBD_GOTO_WIN_NEXT=;
KBD_GOTO_WIN_LAST=o

## Go to session command prefix.
KBD_GOTO_SESS=s

### Go to previous / next session.
KBD_GOTO_SESS_PREV=j
KBD_GOTO_SESS_NEXT=;

### Go to session with tree view.
KBD_GOTO_SESS_TREE=t
