# tmux options
set-option -g mouse on
set -g mode-keys vi

# Use C-Space as prefix instead of C-b
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

bind r source-file ~/.tmux.conf \; display "Reloaded tmux.conf"

# ---------------------------------------------------------------------------
# Copy / paste (Wayland + foot)
# ---------------------------------------------------------------------------
# tmux defaults to set-clipboard=external, which only *forwards* OSC 52 written
# by programs running inside tmux -- copying in tmux's own copy-mode never
# reaches the system clipboard. "on" makes tmux emit OSC 52 itself, which foot
# turns into a real Wayland clipboard write.
set -g set-clipboard on
set -as terminal-features ',foot*:clipboard'

# OSC 52 only writes CLIPBOARD, so pick a helper for the PRIMARY selection too;
# without it middle-click paste has nothing to read. wl-clipboard is the native
# Wayland tool (sudo apt install wl-clipboard), xclip via Xwayland is the
# fallback.
if-shell 'command -v wl-copy >/dev/null 2>&1' {
    set -g @primary-copy  'wl-copy --primary --type text/plain'
    set -g @primary-paste 'wl-paste --primary --no-newline'
} {
    set -g @primary-copy  'xclip -i -selection primary'
    set -g @primary-paste 'xclip -o -selection primary'
}

# tmux 3.6's default copy-mode-vi table binds Enter and C-j to copy, but not y.
bind -T copy-mode-vi y                 send -X copy-pipe-and-cancel '#{@primary-copy}'
bind -T copy-mode-vi Enter             send -X copy-pipe-and-cancel '#{@primary-copy}'
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel '#{@primary-copy}'
bind -T copy-mode-vi DoubleClick1Pane  select-pane \; send -X select-word \; run -d0.3 \; send -X copy-pipe-and-cancel '#{@primary-copy}'
bind -T copy-mode-vi TripleClick1Pane  select-pane \; send -X select-line \; run -d0.3 \; send -X copy-pipe-and-cancel '#{@primary-copy}'

# Same for the click-to-copy paths that start outside copy-mode.
bind -T root DoubleClick1Pane select-pane -t= \; if -F '#{||:#{pane_in_mode},#{mouse_any_flag}}' \
    'send -M' \
    "copy-mode -H ; send -X select-word ; run -d0.3 ; send -X copy-pipe-and-cancel '#{@primary-copy}'"
bind -T root TripleClick1Pane select-pane -t= \; if -F '#{||:#{pane_in_mode},#{mouse_any_flag}}' \
    'send -M' \
    "copy-mode -H ; send -X select-line ; run -d0.3 ; send -X copy-pipe-and-cancel '#{@primary-copy}'"

# tmux's default MouseDown2Pane pastes tmux's *own* buffer, so middle click
# never picks up text selected in another app. Paste PRIMARY instead.
bind -T root MouseDown2Pane select-pane -t= \; if -F '#{||:#{pane_in_mode},#{mouse_any_flag}}' \
    'send -M' \
    "run -b '#{@primary-paste} | tmux load-buffer -b primary_sel - && tmux paste-buffer -d -p -b primary_sel'"

# plugins
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'
set -g @plugin 'nhdaly/tmux-better-mouse-mode'
set -g @emulate-scroll-for-no-mouse-alternate-buffer on
set -g @plugin 'whame/tmux-modal'
set -g @modal-keybindings-conf '~/.config/tmux/modal-keybindings.conf'

run '~/.tmux/plugins/tpm/tpm'
